name: TokTickIT CI

on:
  push:
    branches:
      - 'main'
      - 'lab*-staging'
      - 'feature/**'
  pull_request:
    branches:
      - 'main'
      - 'lab*-staging'

jobs:
  test-server:
    name: Backend API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: toktickit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit

      - name: Apply Prisma migrations & seed database
        working-directory: server
        env:
          DATABASE_URL: "postgresql://postgres:password123@localhost:5432/toktickit?schema=public"
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npx prisma db seed

      - name: Run server automated tests
        working-directory: server
        env:
          DATABASE_URL: "postgresql://postgres:password123@localhost:5432/toktickit?schema=public"
          JWT_SECRET: "lab3-jwt-secret-key-334"
        run: npm test

  test-client:
    name: Frontend Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies
        working-directory: client
        run: npm install --no-audit

      - name: Run client component tests
        working-directory: client
        run: npx vitest run src/components/__tests__/ActionsTaken.test.tsx src/__tests__/lab-04/ActionsTaken.test.tsx src/components/__tests__/TicketDetail.test.tsx
